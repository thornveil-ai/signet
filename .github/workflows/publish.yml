name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for hatchling version resolution
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
      - name: Inspect sdist + wheel
        run: |
          ls -la dist/
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install --upgrade cyclonedx-bom
          # Component-graph SBOM for the built environment. Attached to
          # the GitHub release so downstreams can audit dependencies
          # without reproducing the build. cyclonedx-bom 7.x uses
          # `-o <file>` rather than the older `--outfile` flag.
          mkdir -p sbom
          cyclonedx-py environment --output-format json -o sbom/signet-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing (PEP 740) without third-party actions:
    # thornveil-ai's org allowlist permits actions/* (not pypa/*), so we
    # mint the short-lived PyPI OIDC token directly via GitHub's native
    # id-token endpoint and upload with twine. No long-lived API secret.
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing via OIDC)
        run: |
          python -m pip install --upgrade pip twine
          python - <<'PY'
          import json, os, subprocess, urllib.request

          req_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=pypi"
          req_tok = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          req = urllib.request.Request(req_url, headers={"Authorization": f"Bearer {req_tok}"})
          with urllib.request.urlopen(req, timeout=30) as r:
              oidc_jwt = json.loads(r.read().decode())["value"]

          mint = urllib.request.Request(
              "https://pypi.org/account/oidc/mint-token",
              data=json.dumps({"token": oidc_jwt}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(mint, timeout=30) as r:
              pypi_token = json.loads(r.read().decode())["token"]

          env = {**os.environ, "TWINE_USERNAME": "__token__", "TWINE_PASSWORD": pypi_token}
          subprocess.run(["python", "-m", "twine", "upload", "--non-interactive", "dist/*"], env=env, check=True)
          PY

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/
      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull the section between this version's heading and the next
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.changelog.outputs.version }}
          body_path: release_notes.md
          files: |
            dist/*
            sbom/signet-sbom.cdx.json
          generate_release_notes: false
          prerelease: ${{ contains(steps.changelog.outputs.version, 'a') || contains(steps.changelog.outputs.version, 'b') || contains(steps.changelog.outputs.version, 'rc') }}
